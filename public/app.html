<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>系统工作台 | 极简养生</title>
  <style>
    :root {
      --brand: #0f766e;
      --brand-dark: #0a2a25;
      --line: #e5e7eb;
      --muted: #6b7280;
      --panel: #f7f7f5;
      --text: #111827;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: #fff;
    }

    .workspace {
      height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      background: #fff;
    }

    .workspace.is-collapsed {
      grid-template-columns: 82px minmax(0, 1fr);
    }

    .sidebar {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 4px 8px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font-size: 28px;
      font-weight: 900;
    }

    .brand-name {
      min-width: 0;
      font-size: 24px;
      font-weight: 900;
      white-space: nowrap;
    }

    .collapse-btn {
      width: 38px;
      height: 38px;
      margin-left: auto;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .nav-list,
    .bottom-nav {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .nav-button {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 18px;
      font-weight: 900;
      text-align: left;
      cursor: pointer;
    }

    .nav-button:hover,
    .nav-button.is-active {
      background: #fff;
      box-shadow: 0 1px 3px rgba(17, 24, 39, .08);
    }

    .nav-icon {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #fff;
      color: var(--brand);
      font-size: 17px;
      font-weight: 900;
    }

    .workspace.is-collapsed .brand-name,
    .workspace.is-collapsed .nav-label,
    .workspace.is-collapsed .user-meta,
    .workspace.is-collapsed .account-panel {
      display: none;
    }

    .workspace.is-collapsed .brand-row {
      justify-content: center;
      padding: 4px 0;
    }

    .workspace.is-collapsed .collapse-btn {
      position: absolute;
      left: 62px;
      top: 18px;
      border: 1px solid var(--line);
    }

    .workspace.is-collapsed .nav-button {
      justify-content: center;
      padding: 12px;
    }

    .workspace.is-collapsed .nav-icon {
      width: 36px;
      height: 36px;
    }

    .bottom-nav {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .user-meta {
      padding: 0 12px 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .account-panel {
      display: grid;
      gap: 8px;
      padding: 10px 12px 0;
    }

    .account-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .account-email {
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .logout-button {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .logout-button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .content {
      min-width: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr);
      background: #fff;
    }

    .content-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
    }

    .content-title {
      display: grid;
      gap: 2px;
    }

    .content-title strong {
      font-size: 20px;
    }

    .content-title span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .small-button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    .frame-wrap {
      min-height: 0;
      position: relative;
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #fff;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--muted);
      font-weight: 900;
    }

    .loading.hidden {
      display: none;
    }

    @media (max-width: 780px) {
      .workspace,
      .workspace.is-collapsed {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .sidebar {
        padding: 12px 8px;
      }

      .brand-name,
      .nav-label,
      .user-meta,
      .account-panel {
        display: none;
      }

      .brand-row,
      .nav-button {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
      }

      .collapse-btn {
        display: none;
      }

      .content {
        grid-template-rows: 58px minmax(0, 1fr);
      }

      .content-topbar {
        padding: 0 10px;
      }

      .content-title strong {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="workspace" id="workspaceShell">
    <aside class="sidebar" aria-label="系统导航">
      <div class="brand-row">
        <span class="brand-mark">简</span>
        <span class="brand-name">极简养生</span>
        <button class="collapse-btn" id="collapseBtn" type="button" aria-label="缩小左边导航">‹</button>
      </div>

      <nav class="nav-list">
        <button class="nav-button" type="button" data-module="simplepay">
          <span class="nav-icon">付</span>
          <span class="nav-label">简单支付</span>
        </button>
        <button class="nav-button" type="button" data-module="affiliate">
          <span class="nav-icon">盟</span>
          <span class="nav-label">简单联盟</span>
        </button>
        <button class="nav-button" type="button" data-module="pos">
          <span class="nav-icon">POS</span>
          <span class="nav-label">简单POS</span>
        </button>
      </nav>

      <div class="bottom-nav">
        <button class="nav-button" type="button" data-module="member">
          <span class="nav-icon">会</span>
          <span class="nav-label">会员中心</span>
        </button>
        <div class="account-panel" aria-label="登录状态">
          <span class="account-label" id="userMeta">正在检查登录状态...</span>
          <strong class="account-email" id="accountEmail">正在检查...</strong>
          <button class="logout-button" id="workspaceLogoutBtn" type="button">退出登录</button>
        </div>
      </div>
    </aside>

    <section class="content">
      <header class="content-topbar">
        <div class="content-title">
          <strong id="contentTitle">简单支付</strong>
          <span id="contentHint">统一工作台</span>
        </div>
        <div class="top-actions">
          <a class="small-button" href="./index.html">首页</a>
          <button class="small-button" id="openStandaloneBtn" type="button">独立打开</button>
        </div>
      </header>
      <div class="frame-wrap">
        <div class="loading" id="loadingState">正在载入系统...</div>
        <iframe id="systemFrame" title="系统内容"></iframe>
      </div>
    </section>
  </main>

  <script type="module">
    if (location.pathname.endsWith("/app.html")) {
      const target = new URL("./system.html", location.href);
      const current = new URL(location.href);
      current.searchParams.forEach((value, key) => target.searchParams.set(key, value));
      target.searchParams.set("v", "workspace-auth4");
      location.replace(target.href);
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      browserLocalPersistence,
      onAuthStateChanged,
      setPersistence,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    let configModule;
    try {
      configModule = await import("./shared/firebase-config.local.js");
    } catch {
      configModule = await import("./shared/firebase-config.js");
    }

    const app = initializeApp(configModule.firebaseConfig);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence).catch(() => {});

    const workspaceShell = document.querySelector("#workspaceShell");
    const collapseBtn = document.querySelector("#collapseBtn");
    const frame = document.querySelector("#systemFrame");
    const loadingState = document.querySelector("#loadingState");
    const contentTitle = document.querySelector("#contentTitle");
    const contentHint = document.querySelector("#contentHint");
    const userMeta = document.querySelector("#userMeta");
    const accountEmail = document.querySelector("#accountEmail");
    const workspaceLogoutBtn = document.querySelector("#workspaceLogoutBtn");
    const openStandaloneBtn = document.querySelector("#openStandaloneBtn");
    const navButtons = [...document.querySelectorAll("[data-module]")];
    const loginNext = "./system.html?module=home";
    const unifiedLoginKey = "simplepos-unified-google-user";
    const loginReturnKey = "simplepos-login-returning";
    const moduleVersion = "workspace-auth5";
    let activeModuleName = "";
    let initialModuleLoaded = false;
    let hasConfirmedUser = false;
    let loginRedirectTimer = null;
    const modules = {
      simplepay: {
        title: "简单支付",
        hint: "付款、收款、退款、结算",
        url: `./simplepay/index.html?embed=1&v=${moduleVersion}`
      },
      affiliate: {
        title: "简单联盟",
        hint: "推荐、协议、佣金与会员关系",
        url: `./affiliate/index.html?embed=1&v=${moduleVersion}`
      },
      pos: {
        title: "简单POS",
        hint: "下单、收银、库存与报告",
        url: `./pos/index.html?embed=1&v=${moduleVersion}`
      },
      member: {
        title: "会员中心",
        hint: "会员资料、健康档案与账户信息",
        url: `./member/index.html?embed=1&v=${moduleVersion}`
      }
    };

    function getInitialModule() {
      const params = new URLSearchParams(window.location.search);
      const module = params.get("module") || "member";
      return modules[module] ? module : "member";
    }

    function redirectToLogin(force = false) {
      if (!force && (auth.currentUser || hasRecentLoginHint() || hasFreshLoginReturn())) {
        return;
      }
      window.location.replace(`./login.html?next=${encodeURIComponent(loginNext)}`);
    }

    function readUnifiedLoginHint() {
      try {
        return JSON.parse(localStorage.getItem(unifiedLoginKey) || "null");
      } catch {
        return null;
      }
    }

    function hasRecentLoginHint() {
      const hint = readUnifiedLoginHint();
      if (!hint?.updatedAt) return false;
      const updatedAt = Date.parse(hint.updatedAt);
      if (!Number.isFinite(updatedAt)) return false;
      return Date.now() - updatedAt < 1000 * 60 * 60 * 24 * 14;
    }

    function hasFreshLoginReturn() {
      try {
        const value = Number(sessionStorage.getItem(loginReturnKey) || "0");
        return Number.isFinite(value) && Date.now() - value < 1000 * 20;
      } catch {
        return false;
      }
    }

    function rememberUnifiedLogin(user) {
      try {
        localStorage.setItem(unifiedLoginKey, JSON.stringify({
          email: user.email || "",
          uid: user.uid || "",
          displayName: user.displayName || "",
          updatedAt: new Date().toISOString()
        }));
      } catch {}
    }

    function clearUnifiedLogin() {
      try {
        localStorage.removeItem(unifiedLoginKey);
        sessionStorage.removeItem(loginReturnKey);
      } catch {}
    }

    function setAccountPanel(status, email, canLogout = false) {
      userMeta.textContent = status;
      accountEmail.textContent = email || "未登录";
      workspaceLogoutBtn.disabled = !canLogout;
      workspaceLogoutBtn.textContent = canLogout ? "退出登录" : "等待登录...";
    }

    function hydrateAccountPanelFromHint() {
      const hint = readUnifiedLoginHint();
      if (hint?.email) {
        setAccountPanel("登录状态同步中", hint.email, true);
      } else {
        setAccountPanel("正在检查登录状态", "正在检查...", false);
      }
    }

    function setModule(moduleName, replace = false) {
      const module = modules[moduleName] || modules.simplepay;
      if (activeModuleName === moduleName && frame.getAttribute("src") === module.url) {
        return;
      }
      activeModuleName = moduleName;
      loadingState.classList.remove("hidden");
      contentTitle.textContent = module.title;
      contentHint.textContent = module.hint;
      frame.src = module.url;
      navButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.module === moduleName);
      });
      const nextUrl = `./system.html?module=${encodeURIComponent(moduleName)}`;
      if (replace) {
        history.replaceState({ module: moduleName }, "", nextUrl);
      } else {
        history.pushState({ module: moduleName }, "", nextUrl);
      }
    }

    navButtons.forEach((button) => {
      button.addEventListener("click", () => setModule(button.dataset.module));
    });

    collapseBtn.addEventListener("click", () => {
      const collapsed = workspaceShell.classList.toggle("is-collapsed");
      collapseBtn.textContent = collapsed ? "›" : "‹";
      collapseBtn.setAttribute("aria-label", collapsed ? "展开左边导航" : "缩小左边导航");
      localStorage.setItem("simplepos-workspace-collapsed", collapsed ? "1" : "0");
    });

    openStandaloneBtn.addEventListener("click", () => {
      if (frame.src) window.open(frame.src, "_blank", "noopener");
    });

    workspaceLogoutBtn.addEventListener("click", async () => {
      workspaceLogoutBtn.disabled = true;
      workspaceLogoutBtn.textContent = "正在退出...";
      userMeta.textContent = "正在退出登录";
      accountEmail.textContent = "正在退出...";
      clearUnifiedLogin();
      localStorage.setItem("simplepos-force-account-choice", "1");
      try {
        await signOut(auth);
      } catch {}
      window.location.replace("./index.html");
    });

    frame.addEventListener("load", () => {
      loadingState.classList.add("hidden");
    });

    window.addEventListener("popstate", () => {
      setModule(getInitialModule(), true);
    });

    if (localStorage.getItem("simplepos-workspace-collapsed") === "1") {
      workspaceShell.classList.add("is-collapsed");
      collapseBtn.textContent = "›";
    }

    hydrateAccountPanelFromHint();

    onAuthStateChanged(auth, (user) => {
      if (user) {
        hasConfirmedUser = true;
        try {
          sessionStorage.removeItem(loginReturnKey);
        } catch {}
        if (loginRedirectTimer) {
          window.clearTimeout(loginRedirectTimer);
          loginRedirectTimer = null;
        }
        rememberUnifiedLogin(user);
        setAccountPanel("已登录账号", user.email || user.displayName || "已登录", true);
        if (!initialModuleLoaded) {
          initialModuleLoaded = true;
          setModule(getInitialModule(), true);
        }
        return;
      }

      if (hasConfirmedUser || initialModuleLoaded) {
        setAccountPanel("登录状态同步中", readUnifiedLoginHint()?.email || "登录状态同步中", true);
        if (!initialModuleLoaded) {
          initialModuleLoaded = true;
          setModule(getInitialModule(), true);
        }
        return;
      }

      if (hasRecentLoginHint() || hasFreshLoginReturn()) {
        setAccountPanel("登录状态同步中", readUnifiedLoginHint()?.email || "登录状态同步中", true);
        loadingState.classList.remove("hidden");
        loadingState.textContent = "正在恢复登录状态...";
        if (!loginRedirectTimer) {
          loginRedirectTimer = window.setTimeout(() => redirectToLogin(true), 5000);
        }
        return;
      }

      setAccountPanel("请先登录", "未登录", false);
      if (!loginRedirectTimer) {
        loginRedirectTimer = window.setTimeout(() => redirectToLogin(true), 5000);
      }
    });
  </script>
</body>
</html>
