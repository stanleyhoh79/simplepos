<body><main class="shell"><div class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">简</span><span>极简养生</span></a><a class="button" href="./index.html" target="_blank">查看公众首页</a></div><section class="hero"><h1>首页内容设置</h1><p>修改标题、文案、图片和常见问题。先保存草稿并预览，确认无误后再正式发布；系统会保留上一版供恢复。</p></section><section class="auth"><div><strong>管理员验证</strong><p id="authStatus">正在检查登录状态……</p></div><div class="actions"><button class="button primary" id="loginBtn">管理员登录</button><button class="button hidden" id="logoutBtn">退出登录</button></div></section>
<form id="settingsForm" class="hidden"><div class="workspace"><nav class="side" id="sectionNav"><button class="active" data-panel="brand">品牌与联系</button><button data-panel="hero">首页首屏</button><button data-panel="about">计划介绍</button><button data-panel="process">执行流程</button><button data-panel="drinks">草本饮料</button><button data-panel="audience">适用与注意</button><button data-panel="system">网站系统</button><button data-panel="refund">退款保障</button><button data-panel="faq">常见问题</button><button data-panel="cta">结尾行动</button></nav><section class="editor">
<section class="panel active" data-panel-id="brand"><h2>品牌与联系</h2><div class="grid"><label>品牌名称<input id="brandName" type="text" maxlength="20"></label><label>品牌口号<input id="brandSlogan" type="text" maxlength="80"></label><label>WhatsApp（含国家码）<input id="brandWhatsapp" type="text" maxlength="30" placeholder="例如 60123456789"></label><label>电子邮件<input id="brandEmail" type="email" maxlength="100"></label></div><label>地址或服务地区<input id="brandAddress" type="text" maxlength="100"></label><div class="image-row"><div class="image-preview square" id="logoPreview">简</div><div class="image-controls"><label>品牌 Logo<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label><span class="hint">自动压缩为 WebP。Logo 建议使用正方形。</span><button class="button" id="clearLogo" type="button">恢复默认图标</button></div></div></section>
<section class="panel" data-panel-id="hero"><h2>首页首屏</h2><label>顶部小标题<input id="heroEyebrow" type="text" maxlength="80"></label><label>大标题（可换行）<textarea id="heroTitle" maxlength="120"></textarea></label><label>说明文字<textarea id="heroSubtitle" maxlength="320"></textarea></label><div class="grid"><label>主按钮文字<input id="heroPrimaryText" type="text" maxlength="20"></label><label>主按钮链接<input id="heroPrimaryLink" type="text" maxlength="160"></label><label>次按钮文字<input id="heroSecondaryText" type="text" maxlength="20"></label><label>次按钮链接<input id="heroSecondaryLink" type="text" maxlength="160"></label></div><label>系统按钮文字<input id="heroSystemText" type="text" maxlength="20"></label><label>信任短句（每行一个，最多 6 个）<textarea id="heroTrust"></textarea></label><div class="image-row"><div class="image-preview" id="heroImagePreview">首屏图</div><div class="image-controls"><label>首屏图片<input id="heroImageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><span class="hint">建议使用横向生活场景图。系统会自动压缩。</span><button class="button" id="clearHeroImage" type="button">移除首屏图片</button></div></div></section>
<section class="panel" data-panel-id="about"><h2>计划介绍</h2><label>小标题<input id="aboutKicker" type="text" maxlength="40"></label><label>主标题<input id="aboutTitle" type="text" maxlength="120"></label><label>说明<textarea id="aboutIntro" maxlength="400"></textarea></label><div class="repeat-list" id="featureEditors"></div></section>
<section class="panel" data-panel-id="process"><h2>执行流程</h2><label>主标题<input id="processTitle" type="text" maxlength="120"></label><label>说明<textarea id="processIntro" maxlength="260"></textarea></label><div class="repeat-list" id="processEditors"></div></section>
<section class="panel" data-panel-id="drinks"><h2>草本饮料</h2><label>主标题<input id="drinksTitle" type="text" maxlength="120"></label><label>说明<textarea id="drinksIntro" maxlength="320"></textarea></label><div class="repeat-list" id="drinkEditors"></div></section>
<section class="panel" data-panel-id="audience"><h2>适用与注意</h2><label>主标题<input id="audienceTitle" type="text" maxlength="120"></label><div class="grid"><label>适合标题<input id="suitableTitle" type="text" maxlength="40"></label><label>注意标题<input id="cautionTitle" type="text" maxlength="50"></label></div><div class="grid"><label>适合内容（每行一项）<textarea id="suitableItems" class="long"></textarea></label><label>注意内容（每行一项）<textarea id="cautionItems" class="long"></textarea></label></div></section>
<section class="panel" data-panel-id="system"><h2>网站系统优势</h2><label>小标题<input id="systemKicker" type="text" maxlength="40"></label><label>主标题<input id="systemTitle" type="text" maxlength="100"></label><label>说明<textarea id="systemText" maxlength="400"></textarea></label><label>优势短句（每行一项）<textarea id="systemPoints"></textarea></label></section>
<section class="panel" data-panel-id="refund"><h2>退款保障</h2><label>小标题<input id="refundKicker" type="text" maxlength="40"></label><label>主标题<input id="refundTitle" type="text" maxlength="120"></label><label>说明<textarea id="refundText" class="long" maxlength="600"></textarea></label><div class="grid"><label>按钮文字<input id="refundButtonText" type="text" maxlength="30"></label><label>按钮链接<input id="refundButtonLink" type="text" maxlength="160"></label></div></section>
<section class="panel" data-panel-id="faq"><h2>常见问题</h2><label>区块标题<input id="faqTitle" type="text" maxlength="100"></label><div class="repeat-list" id="faqEditors"></div></section>
<section class="panel" data-panel-id="cta"><h2>结尾行动</h2><label>主标题<input id="ctaTitle" type="text" maxlength="100"></label><label>说明<textarea id="ctaText" maxlength="300"></textarea></label><div class="grid"><label>登录按钮文字<input id="ctaPrimaryText" type="text" maxlength="20"></label><label>联系按钮文字<input id="ctaContactText" type="text" maxlength="20"></label></div></section>
<div class="savebar"><span class="hint" id="publishHint">草稿不会影响公众首页。确认预览后再点击正式发布。</span><div class="actions"><button class="button" id="resetBtn" type="button">恢复默认预览</button><button class="button" id="restoreBtn" type="button">恢复上一版本</button><button class="button" type="submit">保存草稿</button><button class="button primary" id="publishBtn" type="button">正式发布</button></div></div><p class="status" id="statusLine"></p></section></div></form><section class="preview hidden" id="previewSection"><div class="actions" style="justify-content:space-between"><strong>首页实时预览</strong><button class="button" id="refreshPreview" type="button">刷新预览</button></div><iframe class="preview-frame" id="previewFrame" src="./index.html?preview=1" title="首页预览"></iframe></section></main>

function render(s){state=merge(s);pending={logo:state.brand.logoDataUrl||"",hero:state.hero.imageDataUrl||"",drinks:state.drinks.items.slice(0,4).map(x=>x.imageDataUrl||"")};input("#brandName",state.brand.name);input("#brandSlogan",state.brand.slogan);input("#brandWhatsapp",state.brand.whatsapp);input("#brandEmail",state.brand.email);input("#brandAddress",state.brand.address);input("#heroEyebrow",state.hero.eyebrow);input("#heroTitle",state.hero.title);input("#heroSubtitle",state.hero.subtitle);input("#heroPrimaryText",state.hero.primaryText);input("#heroPrimaryLink",state.hero.primaryLink);input("#heroSecondaryText",state.hero.secondaryText);input("#heroSecondaryLink",state.hero.secondaryLink);input("#heroSystemText",state.hero.systemText);input("#heroTrust",state.hero.trust.join("\n"));input("#aboutKicker",state.about.kicker);input("#aboutTitle",state.about.title);input("#aboutIntro",state.about.intro);input("#processTitle",state.process.title);input("#processIntro",state.process.intro);input("#drinksTitle",state.drinks.title);input("#drinksIntro",state.drinks.intro);input("#audienceTitle",state.audience.title);input("#suitableTitle",state.audience.suitableTitle);input("#cautionTitle",state.audience.cautionTitle);input("#suitableItems",state.audience.suitable.join("\n"));input("#cautionItems",state.audience.caution.join("\n"));input("#systemKicker",state.system.kicker);input("#systemTitle",state.system.title);input("#systemText",state.system.text);input("#systemPoints",state.system.points.join("\n"));input("#refundKicker",state.refund.kicker);input("#refundTitle",state.refund.title);input("#refundText",state.refund.text);input("#refundButtonText",state.refund.buttonText);input("#refundButtonLink",state.refund.buttonLink);input("#faqTitle",state.faq.title);input("#ctaTitle",state.cta.title);input("#ctaText",state.cta.text);input("#ctaPrimaryText",state.cta.primaryText);input("#ctaContactText",state.cta.contactText);imagePreview("#logoPreview",pending.logo,"简");imagePreview("#heroImagePreview",pending.hero,"首屏图");repeatEditors()}
function read(){const next=clone(state);next.version=2;next.brand={name:$("#brandName").value.trim(),slogan:$("#brandSlogan").value.trim(),whatsapp:$("#brandWhatsapp").value.trim(),email:$("#brandEmail").value.trim(),address:$("#brandAddress").value.trim(),logoDataUrl:pending.logo};next.hero={eyebrow:$("#heroEyebrow").value.trim(),title:$("#heroTitle").value.trim(),subtitle:$("#heroSubtitle").value.trim(),imageDataUrl:pending.hero,primaryText:$("#heroPrimaryText").value.trim(),primaryLink:$("#heroPrimaryLink").value.trim(),secondaryText:$("#heroSecondaryText").value.trim(),secondaryLink:$("#heroSecondaryLink").value.trim(),systemText:$("#heroSystemText").value.trim(),trust:lines($("#heroTrust").value).slice(0,6)};next.about.kicker=$("#aboutKicker").value.trim();next.about.title=$("#aboutTitle").value.trim();next.about.intro=$("#aboutIntro").value.trim();next.process.title=$("#processTitle").value.trim();next.process.intro=$("#processIntro").value.trim();next.drinks.title=$("#drinksTitle").value.trim();next.drinks.intro=$("#drinksIntro").value.trim();next.drinks.items=next.drinks.items.slice(0,4).map((x,i)=>({...x,imageDataUrl:pending.drinks[i]||""}));next.audience={title:$("#audienceTitle").value.trim(),suitableTitle:$("#suitableTitle").value.trim(),suitable:lines($("#suitableItems").value).slice(0,8),cautionTitle:$("#cautionTitle").value.trim(),caution:lines($("#cautionItems").value).slice(0,8)};next.system={kicker:$("#systemKicker").value.trim(),title:$("#systemTitle").value.trim(),text:$("#systemText").value.trim(),points:lines($("#systemPoints").value).slice(0,6)};next.refund={kicker:$("#refundKicker").value.trim(),title:$("#refundTitle").value.trim(),text:$("#refundText").value.trim(),buttonText:$("#refundButtonText").value.trim(),buttonLink:$("#refundButtonLink").value.trim()};next.faq.title=$("#faqTitle").value.trim();next.cta={title:$("#ctaTitle").value.trim(),text:$("#ctaText").value.trim(),primaryText:$("#ctaPrimaryText").value.trim(),contactText:$("#ctaCo function bindDynamic(){document.querySelectorAll("[data-feature]").forEach(e=>e.addEventListener("input",()=>state.about.features[+e.dataset.feature][e.dataset.key]=e.value));document.querySelectorAll("[data-step]").forEach(e=>e.addEventListener("input",()=>state.process.steps[+e.dataset.step][e.dataset.key]=e.value));document.querySelectorAll("[data-drink]").forEach(e=>e.addEventListener("input",()=>state.drinks.items[+e.dataset.drink][e.dataset.key]=e.value));document.querySelectorAll("[data-faq]").forEach(e=>e.addEventListener("input",()=>state.faq.items[+e.dataset.faq][e.dataset.key]=e.value));document.querySelectorAll("[data-drink-file]").forEach(e=>e.addEventListener("change",async()=>{const i=+e.dataset.drinkFile;try{pending.drinks[i]=await shrink(e.files?.[0],720,90000);imagePreview(`#drinkPreview${i}`,pending.drinks[i],"饮料图");status("图片已准备，保存后生效。") }catch(err){status(err.message,true)}}));document.querySelectorAll("[data-clear-drink]").forEach(e=>e.addEventListener("click",()=>{const i=+e.dataset.clearDrink;pending.drinks[i]="";imagePreview(`#drinkPreview${i}`,"","饮料图")}))}
async function shrink(file,maxEdge,maxChars){if(!file||!["image/png","image/jpeg","image/webp"].includes(file.type))throw Error("请选择 PNG、JPG 或 WebP 图片。");if(file.size>5*1024*1024)throw Error("图片请控制在 5MB 以内。");const url=URL.createObjectURL(file);try{const im=await new Promise((r,j)=>{const x=new Image;x.onload=()=>r(x);x.onerror=()=>j(Error("图片无法读取。"));x.src=url});const scale=Math.min(1,maxEdge/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext("2d").drawImage(im,0,0,c.width,c.height);let q=.82,data="";while(q>=.48){data=c.toDataURL("image/webp",q);if(data.length<=maxChars)return data;q-=.08}throw Error("压缩后仍然过大，请换一张较简单的图片。")}finally{URL.revokeObjectURL(url)}}function status(t,err=false){$("#statusLine").textContent=t;$("#statusLine").classList.toggle("error",err)}
$("#sectionNav").addEventListener("click",e=>{const b=e.target.closest("button[data-panel]");if(!b)return;document.querySelectorAll("#sectionNav button").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("active",x.dataset.panelId===b.dataset.panel))});$("#loginBtn").addEventListener("click",()=>signInWithPopup(auth,provider).catch(e=>status(`登录失败：${e.message}`,true)));$("#logoutBtn").addEventListener("click",()=>signOut(auth));$("#logoFile").addEventListener("change",async e=>{try{pending.logo=await shrink(e.target.files?.[0],240,80000);imagePreview("#logoPreview",pending.logo,"简");status("Logo 已准备，保存后生效。") }catch(err){status(err.message,true)}});$("#heroImageFile").addEventListener("change",async e=>{try{pending.hero=await shrink(e.target.files?.[0],1400,180000);imagePreview("#heroImagePreview",pending.hero,"首屏图");status("首屏图已准备，保存后生效。") }catch(err){status(err.message,true)}});$("#clearLogo").addEventListener("click",()=>{pending.logo="";imagePreview("#logoPreview","","简")});$("#clearHeroImage").addEventListener("click",()=>{pending.hero="";imagePreview("#heroImagePreview","","首屏图")});$("#resetBtn").addEventListener("click",()=>{render(defaults);status("已恢复默认预览，点击保存才会写入云端。")});function previewDraft(next=read()){localStorage.setItem(previewKey,JSON.stringify(next));$("#previewFrame").src=`./index.html?preview=1&v=${Date.now()}`}$("#refreshPreview").addEventListener("click",()=>previewDraft());$("#settingsForm").addEventListener("submit",async e=>{e.preventDefault();if(!isAdmin(auth.currentUser))return status("只有管理员可以保存草稿。",true);const next=read();status("正在保存草稿……");try{const batch=writeBatch(db);batch.set(draftRef,{...next,updatedAt:serverTimestamp(),updatedBy:auth.currentUser.email||auth.currentUser.uid},{merge:false});await batch.commit();localStorage.setItem(cacheKey,JSON.stringify(next));previewDraft(next);render(next);status("草稿已保存，公众首页没有改变。") }catch(err){status(`保存草稿失败：${err.code||err.message}`,true)}});$("#publishBtn").addEventListener("click",async()=>{if(!isAdmin(auth.currentUser))return status("只有管理员可以发布首页。",true);const next=read();if(!confirm("确认把当前草稿发布到公众首页吗？"))return;status("正在正式发布……");try{const current=await getDoc(publishedRef);const batch=writeBatch(db);if(current.exists())batch.set(previousRef,{...current.data(),archivedAt:serverTimestamp(),archivedBy:auth.currentUser.email||auth.currentUser.uid},{merge:false});batch.set(publishedRef,{...next,publishedAt:serverTimestamp(),publishedBy:auth.currentUser.email||auth.currentUser.uid},{merge:false});batch.set(draftRef,{...next,updatedAt:serverTimestamp(),updatedBy:auth.currentUser.email||auth.currentUser.uid},{merge:false});await batch.commit();localStorage.setItem(cacheKey,JSON.stringify(next));previewDraft(next);status("首页已正式发布，并保留上一版本。") }catch(err){status(`发布失败：${err.code||err.message}`,true)}});$("#restoreBtn").addEventListener("click",async()=>{if(!isAdmin(auth.currentUser))return status("只有管理员可以恢复版本。",true);if(!confirm("确认恢复上一版首页吗？当前发布版本会成为新的上一版。"))return;status("正在恢复上一版本……");try{const [previous,current]=await Promise.all([getDoc(previousRef),getDoc(publishedRef)]);if(!previous.exists())return status("目前没有可恢复的上一版本。",true);const batch=writeBatch(db);if(current.exists())batch.set(previousRef,{...current.data(),archivedAt:serverTimestamp(),archivedBy:auth.currentUser.email||auth.currentUser.uid},{merge:false});batch.set(publishedRef,{...previous.data(),publishedAt:serverTimestamp(),publishedBy:auth.currentUser.email||auth.currentUser.uid,restored:true},{merge:false});batch.set(draftRef,{...previous.data(),updatedAt:serverTimestamp(),updatedBy:auth.currentUser.email||auth.currentUser.uid},{merge:false});await batch.commit();render(previous.data());previewDraft(previous.data());status("上一版本已恢复并重新发布。") }catch(err){status(`恢复失败：${err.code||err.message}`,true)}});
onAuthStateChanged(auth,async user=>{const ok=isAdmin(user);$("#loginBtn").classList.toggle("hidden",!!user);$("#logoutBtn").classList.toggle("hidden",!user);$("#settingsForm").classList.toggle("hidden",!ok);$("#previewSection").classList.toggle("hidden",!ok);if(!user){$("#authStatus").textContent="请使用管理员 Google 账号登录。";return}if(!ok){$("#authStatus").textContent=`当前账号 ${user.email||""} 不是管理员。`;return}$("#authStatus").textContent=`管理员已登录：${user.email}`;try{const [draft,published,legacy]=await Promise.all([getDoc(draftRef),getDoc(publishedRef),getDoc(legacyRef)]);const initial=draft.exists()?draft.data():(published.exists()?published.data():(legacy.exists()?legacy.data():defaults));render(initial);previewDraft(initial);$("#publishHint").textContent=published.exists()?"草稿不会影响公众首页。系统已存在正式发布版本。":"尚未建立正式发布版本；请先检查预览，再点击正式发布。"}catch(e){render(defaults);previewDraft(defaults);status(`读取失败：${e.code||e.message}`,true)}});
